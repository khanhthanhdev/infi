<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infi — Academic Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --poster-w: 594mm;
      --poster-h: 841mm;
      --font-scale: 1;
      --bg: #fafbfc;
      --ink: #1a1a2e;
      --ink-secondary: #4a4a6a;
      --muted: #7a7a9a;
      --border: #e2e4e8;
      --blue: #2563eb;
      --blue-light: #eff6ff;
      --amber: #f59e0b;
      --amber-light: #fffbeb;
      --green: #10b981;
      --green-light: #ecfdf5;
      --red: #ef4444;
      --red-light: #fef2f2;
      --radius: 6px;
    }
    html, body { background: #e5e5e5; font-family: 'Inter', sans-serif; }
    body { display: flex; justify-content: center; padding: 20px; }
    #root { width: 100%; }

    /* Poster container */
    .poster-shell {
      width: var(--poster-w);
      min-height: var(--poster-h);
      background: var(--bg);
      color: var(--ink);
      font-size: calc(11px * var(--font-scale));
      line-height: 1.5;
      position: relative;
      margin: 0 auto;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    /* Toolbar */
    .poster-toolbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: #1a1a2e; color: #fff; padding: 8px 16px;
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; font-family: 'Inter', sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .poster-toolbar button {
      background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2);
      padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: 'Inter', sans-serif;
    }
    .poster-toolbar button:hover { background: rgba(255,255,255,0.22); }
    .poster-toolbar .spacer { flex: 1; }
    .poster-toolbar .info { font-size: 11px; opacity: 0.7; }

    /* Header */
    .poster-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 24mm 20mm 10mm 20mm;
      border-bottom: 2px solid var(--ink);
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }
    .poster-header h1 {
      font-family: 'Inter Tight', sans-serif; font-weight: 700;
      font-size: calc(48px * var(--font-scale)); letter-spacing: -0.03em; line-height: 1;
    }
    .poster-header .subtitle {
      font-size: calc(18px * var(--font-scale)); margin-top: 6px; opacity: 0.85; font-weight: 500;
    }
    .poster-header .kicker {
      font-size: calc(13px * var(--font-scale)); margin-top: 10px; opacity: 0.65; max-width: 55ch;
    }
    .header-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .header-right .team-label { font-size: calc(10px * var(--font-scale)); text-transform: uppercase; letter-spacing: 0.14em; opacity: 0.5; }
    .header-right .team-name { font-size: calc(14px * var(--font-scale)); font-weight: 600; }
    .header-right .team-members { font-size: calc(11px * var(--font-scale)); opacity: 0.6; }
    .qr-box {
      width: 70px; height: 70px; border: 2px solid rgba(255,255,255,0.3); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: calc(9px * var(--font-scale)); text-align: center; opacity: 0.5;
      margin-top: 4px;
    }
    .header-logo { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .header-logo img { width: 36px; height: 36px; border-radius: 8px; }

    /* Agents row */
    .agents-row {
      display: flex; align-items: center; gap: 16px; padding: 8px 20mm;
      border-bottom: 1px solid var(--border); background: #fff; font-size: calc(10px * var(--font-scale));
      overflow: hidden;
    }
    .agents-row .label { font-size: calc(9px * var(--font-scale)); color: var(--muted); white-space: nowrap; }
    .agent-chip { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .agent-chip img { width: 14px; height: 14px; }

    /* Main grid — 2 columns */
    .poster-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      padding: 0;
      min-height: calc(var(--poster-h) - 160mm);
    }
    .poster-col { padding: 8mm 10mm; border-right: 1px solid var(--border); }
    .poster-col:last-child { border-right: none; }

    /* Cards */
    .card {
      margin-bottom: 6mm; border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--border); background: #fff;
      position: relative;
    }
    .card-handle {
      position: absolute; top: 6px; right: 6px; width: 14px; height: 14px;
      background: var(--ink); transform: rotate(45deg); border-radius: 2px;
      cursor: grab; opacity: 0.15; z-index: 10; transition: opacity 0.15s;
    }
    .card:hover .card-handle { opacity: 0.5; }
    .card-header {
      padding: 4mm 5mm 3mm 5mm; border-bottom: 1px solid var(--border);
    }
    .card-pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: calc(9px * var(--font-scale)); font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--blue); margin-bottom: 2mm;
    }
    .card-title {
      font-family: 'Inter Tight', sans-serif; font-weight: 600;
      font-size: calc(16px * var(--font-scale)); letter-spacing: -0.01em; line-height: 1.25;
    }
    .card-desc {
      font-size: calc(11px * var(--font-scale)); color: var(--muted); margin-top: 2mm;
    }
    .card-body { padding: 3mm 5mm 4mm 5mm; }
    .card-body p { margin-bottom: 2.5mm; font-size: calc(11px * var(--font-scale)); line-height: 1.55; }
    .card-body h3 {
      font-family: 'Inter Tight', sans-serif; font-weight: 600;
      font-size: calc(12px * var(--font-scale)); margin: 3mm 0 2mm 0;
    }
    .card-body ul, .card-body ol { padding-left: 5mm; margin-bottom: 2.5mm; }
    .card-body li { font-size: calc(11px * var(--font-scale)); margin-bottom: 1mm; line-height: 1.5; }
    .card-body img { width: 100%; border-radius: 4px; margin: 2mm 0; }
    .card-body table { width: 100%; border-collapse: collapse; font-size: calc(10px * var(--font-scale)); margin: 2mm 0; }
    .card-body th, .card-body td { padding: 1.5mm 2.5mm; text-align: left; border-bottom: 1px solid var(--border); }
    .card-body th { font-weight: 600; font-size: calc(9px * var(--font-scale)); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .card-body code { font-family: 'JetBrains Mono', monospace; font-size: calc(9.5px * var(--font-scale)); background: #f1f3f5; padding: 1px 4px; border-radius: 3px; }
    .card-body strong { font-weight: 600; }

    /* Metric cards */
    .metrics-row { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5mm; margin: 2.5mm 0; }
    .metric-box {
      background: var(--blue-light); border-radius: var(--radius); padding: 3mm;
      text-align: center; border-top: 3px solid var(--blue);
    }
    .metric-box.amber { background: var(--amber-light); border-top-color: var(--amber); }
    .metric-box.green { background: var(--green-light); border-top-color: var(--green); }
    .metric-box.red { background: var(--red-light); border-top-color: var(--red); }
    .metric-value { font-family: 'JetBrains Mono', monospace; font-size: calc(20px * var(--font-scale)); font-weight: 700; line-height: 1; }
    .metric-label { font-size: calc(8.5px * var(--font-scale)); color: var(--muted); margin-top: 1mm; }

    /* Highlight box */
    .highlight-box {
      background: var(--blue-light); border-left: 3px solid var(--blue);
      padding: 3mm 4mm; border-radius: 0 var(--radius) var(--radius) 0; margin: 2.5mm 0;
    }
    .highlight-box p { margin: 0; font-size: calc(11px * var(--font-scale)); }

    /* Method steps */
    .method-step {
      display: flex; gap: 2.5mm; padding: 2.5mm 0; border-bottom: 1px solid var(--border);
    }
    .method-step:last-child { border-bottom: none; }
    .method-step-num {
      font-family: 'JetBrains Mono', monospace; font-size: calc(10px * var(--font-scale));
      font-weight: 600; color: var(--blue); min-width: 5mm; padding-top: 0.5mm;
    }
    .method-step-text { flex: 1; }
    .method-step-text strong { display: block; font-size: calc(11px * var(--font-scale)); margin-bottom: 0.5mm; }
    .method-step-text span { font-size: calc(10px * var(--font-scale)); color: var(--muted); }

    /* Flow diagram */
    .flow-row { display: flex; align-items: center; gap: 2mm; margin: 2.5mm 0; flex-wrap: wrap; }
    .flow-step {
      background: var(--ink); color: #fff; padding: 2mm 3.5mm; border-radius: var(--radius);
      font-size: calc(9px * var(--font-scale)); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .flow-arrow { color: var(--muted); font-size: calc(14px * var(--font-scale)); }

    /* Risk table */
    .risk-severity {
      font-family: 'JetBrains Mono', monospace; font-size: calc(8.5px * var(--font-scale));
      font-weight: 600; padding: 1mm 2mm; border-radius: 3px; text-transform: uppercase;
    }
    .risk-severity.high { background: var(--red-light); color: var(--red); }
    .risk-severity.med { background: var(--amber-light); color: var(--amber); }

    /* Validation grid */
    .validation-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5mm; margin: 2.5mm 0; }
    .validation-item {
      padding: 2.5mm; border: 1px solid var(--border); border-radius: var(--radius);
    }
    .validation-item .num {
      font-family: 'JetBrains Mono', monospace; font-size: calc(9px * var(--font-scale));
      color: var(--blue); font-weight: 600;
    }
    .validation-item strong { display: block; font-size: calc(10.5px * var(--font-scale)); margin: 0.5mm 0; }
    .validation-item p { font-size: calc(9.5px * var(--font-scale)); color: var(--muted); margin: 0; }

    /* Tool strip */
    .tool-strip {
      display: flex; flex-wrap: wrap; gap: 2mm; margin: 2.5mm 0;
    }
    .tool-strip span {
      font-family: 'JetBrains Mono', monospace; font-size: calc(8.5px * var(--font-scale));
      background: #f1f3f5; padding: 1.5mm 2.5mm; border-radius: 3px; white-space: nowrap;
    }

    /* Features grid */
    .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .feature-item {
      padding: 3mm; border: 1px solid var(--border);
    }
    .feature-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--blue); margin-right: 2mm; vertical-align: middle;
    }
    .feature-dot.amber { background: var(--amber); }
    .feature-num { font-size: calc(8.5px * var(--font-scale)); color: var(--muted); }
    .feature-title { font-size: calc(11px * var(--font-scale)); font-weight: 600; margin: 1mm 0; }
    .feature-desc { font-size: calc(9.5px * var(--font-scale)); color: var(--muted); }

    /* Coverage grid */
    .coverage-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2mm; margin: 2.5mm 0; }
    .coverage-item {
      padding: 2.5mm; border: 1px solid var(--border); border-radius: var(--radius); text-align: center;
    }
    .coverage-item strong { display: block; font-size: calc(9.5px * var(--font-scale)); }
    .coverage-item span { font-size: calc(8.5px * var(--font-scale)); color: var(--muted); }

    /* Screenshot pair */
    .screenshot-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5mm; margin: 2.5mm 0; }
    .screenshot-item { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
    .screenshot-item img { width: 100%; display: block; }
    .screenshot-caption {
      font-size: calc(8.5px * var(--font-scale)); color: var(--muted); text-align: center;
      padding: 1.5mm 2mm; background: #fafbfc;
    }

    /* References */
    .ref-list { list-style: none; padding: 0; }
    .ref-list li {
      font-size: calc(9px * var(--font-scale)); margin-bottom: 1.5mm; padding-left: 7mm;
      position: relative; line-height: 1.4;
    }
    .ref-list .ref-num {
      position: absolute; left: 0; font-family: 'JetBrains Mono', monospace;
      font-weight: 600; color: var(--blue); font-size: calc(8.5px * var(--font-scale));
    }

    /* Footer */
    .poster-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5mm 20mm; border-top: 2px solid var(--ink);
      font-size: calc(9px * var(--font-scale)); color: var(--muted);
      background: #fff;
    }
    .poster-footer .logo { font-weight: 700; font-size: calc(14px * var(--font-scale)); color: var(--ink); }
    .poster-footer a { color: var(--blue); text-decoration: none; }

    /* Drop zones */
    .drop-zone {
      height: 3mm; margin: 1mm 0; border: 2px dashed transparent;
      border-radius: var(--radius); transition: all 0.15s;
    }
    .drop-zone.active { border-color: var(--blue); background: rgba(37, 99, 235, 0.06); }

    /* Print */
    @media print {
      .poster-toolbar { display: none !important; }
      body { background: none; padding: 0; }
      .poster-shell { box-shadow: none; margin: 0; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback, useRef, useEffect } = React;

// ─── IMAGE PATHS (relative to poster/index.html) ──────────────────────
const IMG = {
  agents: '../assets/agents/',
  screenshots: '../assets/screenshots/',
  landing: '../landing/assets/',

  posterAssets: './assets/',

// ─── CARD REGISTRY ────────────────────────────────────────────────────
const CARD_REGISTRY = {

      <h3>Solution Approach</h3>

        <div class="flow-step">1. ORCHESTRATE</div><div class="flow-arrow">→</div>

      <div class="method-step"><div class="method-step-num">04</div><div class="method-step-text"><strong>Assemble report</strong><span>Store source links, scenario tables, thesis bullets, and final stance locally.</span></div></div>
    `
  },
  howitworks: {
    title: "Three Steps. Then You Read.",
    pill: "How It Works",
    color: "#f0fdf4",
    body: `

  portfolio: {
    title: "Portfolio Reviews",
    pill: "Portfolio",
    color: "#f0fdf4",
    body: `
      <p>Add the positions you want reviewed. Reports cover material positions, allocation, risk, and scenario options.</p>

// ─── CARD COMPONENT ───────────────────────────────────────────────────
function Card({ id, data, onDragStart, onDragEnd, isDragging }) {
  const ref = useRef(null);
  return (
    <div
      className="card"
      ref={ref}
      data-card-id={id}
      style={{ opacity: isDragging ? 0.4 : 1 }}
    >
      <div
        className="card-handle"
        draggable
        onDragStart={(e) => {
          e.dataTransfer.setData('text/plain', id);
          e.dataTransfer.effectAllowed = 'move';
          onDragStart(id);
        }}
        onDragEnd={() => onDragEnd()}
        title="Drag to reorder"
      />
      <div className="card-header" style={{ background: data.color }}>
        <div className="card-pill">{data.pill}</div>
        <div className="card-title">{data.title}</div>
      </div>
      <div className="card-body" dangerouslySetInnerHTML={{ __html: data.body }} />
    </div>
  );
}

// ─── COLUMN COMPONENT ─────────────────────────────────────────────────
function Column({ colId, cards, cardIds, onDrop, onDragStart, onDragEnd, draggingId }) {
  const [overIdx, setOverIdx] = useState(-1);

  const handleDragOver = useCallback((e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const items = e.currentTarget.querySelectorAll('.card, .drop-zone');
    let idx = cards.length;
    for (let i = 0; i < items.length; i++) {
      const rect = items[i].getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) { idx = i; break; }
    }
    setOverIdx(idx);
  }, [cards.length]);

  const handleDrop = useCallback((e) => {
    e.preventDefault();
    const cardId = e.dataTransfer.getData('text/plain');
    if (cardId) onDrop(cardId, colId, overIdx >= 0 ? overIdx : cards.length);
    setOverIdx(-1);
  }, [colId, onDrop, overIdx, cards.length]);

  const handleDragLeave = useCallback(() => setOverIdx(-1), []);

  const rendered = [];
  cards.forEach((cid, i) => {
    if (overIdx === i) {
      rendered.push(<div key={`drop-${i}`} className="drop-zone active" />);
    }
    rendered.push(
      <Card
        key={cid}
        id={cid}
        data={cardIds[cid]}
        onDragStart={onDragStart}
        onDragEnd={onDragEnd}
        isDragging={draggingId === cid}
      />
    );
  });
  if (overIdx >= cards.length) {
    rendered.push(<div key="drop-end" className="drop-zone active" />);
  }

  return (
    <div
      className="poster-col"
      onDragOver={handleDragOver}
      onDrop={handleDrop}
      onDragLeave={handleDragLeave}
    >
      {rendered}
    </div>
  );
}

// ─── POSTER COMPONENT ─────────────────────────────────────────────────
function Poster() {
  const [layout, setLayout] = useState(DEFAULT_LAYOUT);
  const [draggingId, setDraggingId] = useState(null);
  const [fontScale, setFontScale] = useState(1);
  const shellRef = useRef(null);

  const handleDrop = useCallback((cardId, targetCol, targetIdx) => {
    setLayout(prev => {
      const cols = prev.columns.map(c => ({ ...c, cards: [...c.cards] }));
      for (const col of cols) {
        const idx = col.cards.indexOf(cardId);
        if (idx !== -1) { col.cards.splice(idx, 1); break; }
      }
      const target = cols.find(c => c.id === targetCol);
      if (target) {
        const insertIdx = Math.min(targetIdx, target.cards.length);
        target.cards.splice(insertIdx, 0, cardId);
      }
      return { ...prev, columns: cols };
    });
    setDraggingId(null);
  }, []);

  const getConfig = useCallback(() => {
    return JSON.stringify({ DEFAULT_LAYOUT: layout, DEFAULT_LOGOS }, null, 2);
  }, [layout]);

  const getWaste = useCallback(() => {
    if (!shellRef.current) return 0;
    const cards = shellRef.current.querySelectorAll('.card');
    const shellRect = shellRef.current.getBoundingClientRect();
    let usedHeight = 0;
    cards.forEach(c => { usedHeight += c.getBoundingClientRect().height; });
    const total = shellRect.height;
    return Math.max(0, ((total - usedHeight) / total * 100)).toFixed(1);
  }, []);

  useEffect(() => {
    window.posterAPI = {
      swapCards: (a, b) => {

          let colA, idxA, colB, idxB;
          for (const col of cols) {
            const ia = col.cards.indexOf(a);
            const ib = col.cards.indexOf(b);
            if (ia !== -1) { colA = col; idxA = ia; }
            if (ib !== -1) { colB = col; idxB = ib; }
          }
          if (colA && colB) {
            colA.cards[idxA] = b;
            colB.cards[idxB] = a;
          }
          return { ...prev, columns: cols };
        });
      },
      moveCard: (cardId, targetCol, pos) => handleDrop(cardId, targetCol, pos),
      setFontScale: (s) => { setFontScale(s); document.documentElement.style.setProperty('--font-scale', s); },
      getWaste,
      getLayout: () => layout,
      getConfig,
      resetLayout: () => setLayout(DEFAULT_LAYOUT),
    };
  }, [layout, handleDrop, getWaste, getConfig]);

  const AGENTS = ['claude','codex','gemini','qwen','mistral','kimi','opencode'];

        <button onClick={() => { const s = Math.min(2, fontScale + 0.1); setFontScale(s); document.documentElement.style.setProperty('--font-scale', s); }}>A+</button>
        <span className="info">Scale: {(fontScale * 100).toFixed(0)}%</span>
        <span style={{ opacity: 0.5 }}>|</span>
        <button onClick={() => window.print()}>Preview</button>
        <button onClick={() => {
          const cfg = getConfig();
          navigator.clipboard.writeText(cfg).then(() => alert('Config copied to clipboard!')).catch(() => {
            const ta = document.createElement('textarea'); ta.value = cfg; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('Config copied!');
          });
        }}>Copy Config</button>
        <button onClick={() => { setLayout(DEFAULT_LAYOUT); alert('Layout reset!'); }}>Reset</button>
        <span className="spacer" />
        <span className="info">Waste: {getWaste()}%</span>
        <span className="info">A1 Portrait · 594 × 841 mm</span>
      </div>

      {/* Poster */}
      <div className="poster-shell" ref={shellRef} style={{ marginTop: 44 }}>
        {/* Header */}
        <header className="poster-header">
          <div>
            <div className="header-logo">
              <img src="../landing/assets/icons/icon.png" alt="Infi" />
            </div>
            <h1>Infi</h1>
            <div className="subtitle">Source-Backed, Structured Investment Research Powered by AI Agents</div>
            <div className="kicker">Empowering beginner investors (F0) by transforming complex financial data into simple, actionable insights — with every claim traceable to its source.</div>
          </div>
          <div className="header-right">
            <div className="team-label">Team 15 — 5nance</div>
            <div className="team-name">IDEA1011 · VinUniversity</div>
            <div className="team-members">Nguyen Minh Nghia · Nguyen Tuan Lam · Nguyen Quy Tu<br/>Tran Khanh Thanh · Dang Tuan Minh</div>
            <div className="qr-box">QR<br/>CODE</div>
          </div>
